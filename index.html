<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标准技术资料管理台</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2d3d; --sub:#6b7a8d;
    --line:#e3e8ef; --brand:#2563eb; --brand-d:#1d4ed8;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --soft:#eef2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header{background:linear-gradient(90deg,var(--brand),var(--brand-d));color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .meta{font-size:12px;opacity:.9}
  nav{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel);padding:8px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  nav button{border:1px solid var(--line);background:#fff;color:var(--sub);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:13px}
  nav button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  main{padding:18px 22px;max-width:1180px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:15px;border-left:4px solid var(--brand);padding-left:8px}
  .grid{display:grid;gap:12px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .stat{background:var(--soft);border-radius:10px;padding:14px}
  .stat .n{font-size:26px;font-weight:700;color:var(--brand)}
  .stat .l{font-size:12px;color:var(--sub);margin-top:2px}
  label{display:block;font-size:12px;color:var(--sub);margin:8px 0 4px}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit}
  textarea{resize:vertical;min-height:60px}
  .row{display:grid;gap:10px}
  .r2{grid-template-columns:1fr 1fr}
  .r3{grid-template-columns:1fr 1fr 1fr}
  button.act{background:var(--brand);color:#fff;border:none;padding:9px 16px;border-radius:7px;cursor:pointer;font-size:13px}
  button.act:hover{background:var(--brand-d)}
  button.ghost{background:#fff;border:1px solid var(--line);color:var(--sub);padding:9px 14px;border-radius:7px;cursor:pointer;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
  th{background:#f0f4fa;color:var(--sub);font-weight:600;position:sticky;top:0}
  tr:nth-child(even) td{background:#fafcff}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px}
  .t-ok{background:#dcfce7;color:var(--ok)}
  .t-warn{background:#fef3c7;color:var(--warn)}
  .t-bad{background:#fee2e2;color:var(--bad)}
  .t-dim{background:#e5e7eb;color:#475569}
  .muted{color:var(--sub);font-size:12px}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
  .pill{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--brand-d)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .search{flex:1;min-width:180px}
  .tree b{color:var(--brand-d)}
  .tree ul{margin:4px 0 4px 18px;padding:0;list-style:none}
  pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto;font-size:12px}
  .hint{font-size:12px;color:var(--sub);background:#fffbeb;border:1px solid #fde68a;padding:8px 10px;border-radius:7px;margin-top:8px}
  .danger{color:var(--bad)}
  .x{cursor:pointer;color:var(--bad);font-weight:700}
  @media(max-width:760px){.g4,.g3,.r2,.r3{grid-template-columns:1fr}}
  .break{word-break:break-all;white-space:pre-wrap}
  .stat{cursor:default}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal.show{display:flex}
  .modal-box{background:#fff;border-radius:12px;max-width:1120px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px}
  .modal-head .x{font-size:18px}
  .modal-body{overflow:auto;padding:14px 18px}
  .modal-body table{font-size:13px}
  .card-head{cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
  .mini-toggle{cursor:pointer;font-size:13px;font-weight:400;color:var(--sub);margin-left:10px;white-space:nowrap}
  .mini-toggle:hover{color:var(--brand)}
  .full{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;padding:16px;box-sizing:border-box}
  .full.show{display:flex}
  .full-head{padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .full-head h2{margin:0 0 8px}
  .full-body{flex:1;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
  .full-body table{font-size:13px}
  .ptree{font-size:13px;line-height:1.65;max-height:560px;overflow:auto;padding:4px 2px}
  .pt-row{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;cursor:pointer;user-select:none}
  .pt-row:hover{background:#eef2ff}
  .pt-file{cursor:default}
  .pt-file:hover{background:#f1f5f9}
  .pt-caret{width:14px;display:inline-block;text-align:center;color:var(--sub);font-size:11px}
  .pt-ico{font-size:13px}
  .pt-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pt-count{font-size:11px;color:var(--sub);background:var(--soft);border-radius:10px;padding:1px 8px;margin-left:6px}
  th.chk,td.chk{width:34px;text-align:center;padding-left:4px;padding-right:4px}
  th.chk input,td.chk input{width:16px;height:16px;cursor:pointer}
  tr.sel td{background:#eef2ff !important}
  .batchbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}
  .selcount{font-size:13px;color:var(--sub)}
  .selcount b{color:var(--brand);font-size:15px}
  .batchbar .sep{flex:1}
  button.batch{background:#fff;border:1px solid var(--line);color:var(--sub);padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13px}
  button.batch.bdel{color:var(--bad);border-color:#fca5a5}
  button.batch.bdel:hover{background:#fee2e2}
  button.batch.bedit{border-color:#93c5fd}
  button.batch.bedit:hover{background:#dbeafe}
  .be-row{margin:12px 0}
  .be-row label{margin-bottom:6px}
  /* 行内编辑 */
  tr.inedit td{background:#fff7ed !important}
  .inv-inp{width:100%;box-sizing:border-box;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:#fff;color:#111}
  .inv-inp:focus{outline:2px solid var(--brand);border-color:var(--brand)}
  td .inv-inp{font-size:12px}
  .lnk{color:var(--brand);cursor:pointer;font-size:12px;margin-left:6px;text-decoration:underline}
  .lnk:hover{opacity:.8}
  .modal-foot{padding:11px 14px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#f8fafc;border-radius:0 0 10px 10px}
  .diff-list{margin:8px 0;font-size:13px;padding-left:18px}
  .diff-list li{margin:6px 0;line-height:1.5}
  .diff-old{color:var(--bad);text-decoration:line-through;margin-right:6px}
  .diff-new{color:var(--ok);font-weight:600}
  .diff-none{color:var(--sub);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>标准技术资料管理台</h1>
  <div class="meta" id="hdrMeta">依据《标准技术资料管理规范》· 本地运行 · 数据存浏览器</div>
</header>
<nav id="nav">
  <button data-tab="dash" class="active">看板</button>
  <button data-tab="inv">资料台账</button>
  <button data-tab="cat">分类目录</button>
  <button data-tab="ver">版本记录</button>
  <button data-tab="led">季度发布台账</button>
  <button data-tab="val">命名校验</button>
  <button data-tab="data">数据备份</button>
</nav>
<main id="main"></main>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-head"><span id="modalTitle"></span><span class="x" onclick="closeModal()">✕</span></div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<div id="invInlineModal" class="modal" onclick="if(event.target===this)closeInvInlineModal()">
  <div class="modal-box">
    <div class="modal-head"><span>确认保存修改</span><span class="x" onclick="closeInvInlineModal()">✕</span></div>
    <div id="invInlineBody" class="modal-body"></div>
    <div class="modal-foot">
      <button class="ghost" onclick="closeInvInlineModal()">取消</button>
      <button class="act" onclick="invCommitInline()">确认保存</button>
    </div>
  </div>
</div>

<div id="invFull" class="full">
  <div class="full-head">
    <h2>资料台账 · 全屏</h2>
    <div class="bar">
      <input id="ff_search" class="search" placeholder="搜索名称/类型/产品线/责任人/标题" oninput="invSearch=this.value;paintInvFull()">
      <select id="ff_type" onchange="invFType=this.value;paintInvFull()"><option value="">全部类型</option></select>
      <select id="ff_status" onchange="invFStatus=this.value;paintInvFull()"><option value="">全部状态</option></select>
      <select id="ff_file" onchange="invFFile=this.value;paintInvFull()"><option value="">全部文件类型</option></select>
      <button class="ghost" onclick="toggleInvFull()">✕ 退出全屏</button>
    </div>
    <div class="batchbar">
      <span class="selcount">已选 <b id="selCountF">0</b> 项</span>
      <button class="batch bedit" onclick="openBatchEdit()">✎ 批量编辑</button>
      <button class="batch bdel" onclick="invBatchDelete()">🗑 批量删除</button>
      <span class="sep"></span>
      <button class="ghost" style="padding:7px 13px" onclick="invClearSel()">清空选择</button>
    </div>
  </div>
  <div class="full-body" id="invFullBody"></div>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY="stdtech_doc_v1";
const TYPES=["产品手册","技术PPT","技术说明","应用方案","技术白皮书","公司宣传"];
const VER_RE=/^(V\d+(\.\d+)*|\d{4}\.Q[1-4](\.\d+)?)$/;
const DATE_RE=/^(\d{4}Q[1-4]|\d{4}[-/]\d{1,2}([-/]\d{1,2})?)$/;
const curQ=()=>{const d=new Date();return d.getFullYear()+"Q"+Math.ceil((d.getMonth()+1)/3);};

let DB=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed();}catch(e){return seed();}}
function seed(){
  return {
    cats:[
      {type:"产品手册",products:["产品A","产品B","产品C"],scenes:["对外销售手册","对内培训手册"]},
      {type:"技术PPT",products:["技术介绍","解决方案","培训课件"],scenes:["售前演示","投标","展会","内部培训"]},
      {type:"技术说明",products:["技术规格书","参数表","选型指南"],scenes:["投标","设计选型","内部研发"]},
      {type:"应用方案",products:["行业应用方案","典型场景方案"],scenes:["市场开拓","客户定制方案"]},
      {type:"技术白皮书",products:["技术原理","标准与合规","趋势研究"],scenes:["行业推广","客户深度交流","官网发布"]},
      {type:"公司宣传",products:["公司介绍","宣传手册","展会宣传"],scenes:["官网展示","展会宣传","商务拜访","招投标"]}
    ],
    items:[], versions:{}, ledger:[]
  };
}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

let tab="dash";
function goto(t){tab=t;$$("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render();}

function validateName(name){
  const parts=name.split("-").map(s=>s.trim());
  const msgs=[]; let ok=true;
  if(parts.length!==5){ok=false;msgs.push("应包含 5 段（用 - 分隔）：产品线-资料类型-标题-版本号-发布日期");}
  else{
    if(!parts[0]){ok=false;msgs.push("第1段 产品线 不能为空");}
    if(!TYPES.includes(parts[1])){ok=false;msgs.push("第2段 资料类型 须为："+TYPES.join(" / "));}
    if(!parts[2]){ok=false;msgs.push("第3段 标题 不能为空");}
    if(!VER_RE.test(parts[3])){ok=false;msgs.push("第4段 版本号 格式错误，应为 V1.0 / V1.1 或 2026.Q3.01");}
    if(!DATE_RE.test(parts[4])){ok=false;msgs.push("第5段 发布日期 格式错误，应为 2026Q3 或 2026-07-01");}
  }
  return {ok,msgs,parts};
}

/* ---------- 看板明细 / 弹窗 ---------- */
function qOf(d){
  if(!d) return null;
  let m=d.match(/(\d{4})Q([1-4])/);
  if(m) return m[1]+"Q"+m[2];
  m=d.match(/^(\d{4})[-/](\d{1,2})/);
  if(m) return m[1]+"Q"+Math.ceil(+m[2]/3);
  return null;
}
function isNeedUpdate(i){
  if(i.status!=="现行"||!i.date) return false;
  const cur=curQ(); const q=qOf(i.date);
  if(!q) return false;
  const [y,qn]=q.match(/(\d{4})Q(\d)/).slice(1).map(Number);
  const [cy,cqn]=cur.match(/(\d{4})Q(\d)/).slice(1).map(Number);
  return (y<cy)||(y===cy&&qn<cqn);
}
const ITEMCOLS=[
  {k:"name",l:"资料名称"},{k:"code",l:"编号"},{k:"productLine",l:"产品线"},{k:"type",l:"类型"},
  {k:"scene",l:"适用场景"},{k:"title",l:"标题"},{k:"version",l:"版本"},{k:"date",l:"发布日期"},
  {k:"status",l:"状态"},{k:"owner",l:"责任人"},{k:"path",l:"存储路径"},{k:"fileType",l:"文件类型"},{k:"remark",l:"备注"}
];
const LEDGERCOLS=[
  {k:"q",l:"季度"},{k:"d",l:"发布日期"},{k:"p",l:"发布人"},{k:"add",l:"新增"},{k:"rev",l:"修订"},{k:"ab",l:"废止"},{k:"n",l:"通知"}
];
function openDash(key){
  let title, rows, cols;
  if(key==="total"){title="全部资料";rows=DB.items;cols=ITEMCOLS;}
  else if(key==="current"){title="现行有效版本";rows=DB.items.filter(i=>i.status==="现行");cols=ITEMCOLS;}
  else if(key==="need"){title="疑似需季度更新";rows=DB.items.filter(isNeedUpdate);cols=ITEMCOLS;}
  else if(key==="ledger"){title="已登记发布季度";rows=DB.ledger.slice();cols=LEDGERCOLS;}
  else if(key.startsWith("type:")){const t=key.slice(5);title="资料类型："+t;rows=DB.items.filter(i=>i.type===t);cols=ITEMCOLS;}
  showModal(title,rows,cols);
}
function openItem(idx){ showModal("资料详情："+DB.items[idx].name,[DB.items[idx]],ITEMCOLS); }
function showModal(title,rows,cols){
  $("#modalTitle").textContent=title+"（"+rows.length+" 条）";
  if(!rows.length){ $("#modalBody").innerHTML='<p class="muted">暂无数据。</p>'; }
  else{
    const head="<tr>"+cols.map(c=>"<th>"+c.l+"</th>").join("")+"</tr>";
    const body=rows.map(r=>"<tr>"+cols.map(c=>{
      const v=r[c.k]==null?"":r[c.k];
      if(c.k==="status"){const cls=r.status==="现行"?"t-ok":r.status==="废止"?"t-bad":"t-dim";return '<td><span class="tag '+cls+'">'+esc(v)+"</span></td>";}
      if(c.k==="path"||c.k==="remark")return '<td class="break">'+esc(v)+"</td>";
      return "<td>"+esc(v)+"</td>";
    }).join("")+"</tr>").join("");
    $("#modalBody").innerHTML="<table><thead>"+head+"</thead><tbody>"+body+"</tbody></table>";
  }
  $("#modal").classList.add("show");
}
function closeModal(){ $("#modal").classList.remove("show"); }

function render(){
  const m=$("#main");
  if(tab==="dash")return dash(m);
  if(tab==="inv")return inv(m);
  if(tab==="cat")return cat(m);
  if(tab==="ver")return ver(m);
  if(tab==="led")return led(m);
  if(tab==="val")return val(m);
  if(tab==="data")return data(m);
}

/* ---------- 看板 ---------- */
function dash(m){
  const items=DB.items;
  const byType={};TYPES.forEach(t=>byType[t]=0);
  items.forEach(i=>{if(byType[i.type]!=null)byType[i.type]++;});
  const cur=curQ();
  const needItems=items.filter(isNeedUpdate);
  const recent=[...items].map((i,idx)=>({i,idx})).sort((a,b)=>(b.i.date||"").localeCompare(a.i.date||"")).slice(0,6);
  m.innerHTML=`
  <div class="hint" style="margin-bottom:10px">提示：双击统计卡片或「类型分布」卡片可查看对应明细；双击「最近更新」行可查看该资料全部信息。</div>
  <div class="card"><h2>当前季度：${cur} · 资料总览</h2>
    <div class="grid g4">
      <div class="stat" style="cursor:pointer" title="双击查看全部资料" ondblclick="openDash('total')"><div class="n">${items.length}</div><div class="l">资料条目总数</div></div>
      <div class="stat" style="cursor:pointer" title="双击查看现行版本" ondblclick="openDash('current')"><div class="n">${items.filter(i=>i.status==="现行").length}</div><div class="l">现行有效版本</div></div>
      <div class="stat" style="cursor:pointer" title="双击查看" ondblclick="openDash('need')"><div class="n" style="color:var(--warn)">${needItems.length}</div><div class="l">疑似需季度更新</div></div>
      <div class="stat" style="cursor:pointer" title="双击查看发布台账" ondblclick="openDash('ledger')"><div class="n">${DB.ledger.length}</div><div class="l">已登记发布季度</div></div>
    </div>
  </div>
  <div class="card"><h2>按资料类型分布（双击查看该类）</h2>
    <div class="grid g3">
      ${TYPES.map(t=>`<div class="stat" style="cursor:pointer" title="双击查看" ondblclick="openDash('type:${t}')"><div class="n">${byType[t]}</div><div class="l">${t}</div></div>`).join("")}
    </div>
  </div>
  <div class="card"><h2>最近更新（双击行查看详情）</h2>
    ${recent.length?`<table><tr><th>名称</th><th>类型</th><th>版本</th><th>发布日期</th><th>责任人</th></tr>
    ${recent.map(o=>`<tr style="cursor:pointer" title="双击查看详情" ondblclick="openItem(${o.idx})"><td>${esc(o.i.name)}</td><td>${o.i.type}</td><td>${o.i.version}</td><td>${o.i.date}</td><td>${esc(o.i.owner||"-")}</td></tr>`).join("")}</table>`
    :`<p class="muted">暂无资料，请到「资料台账」添加。</p>`}
  </div>
  <div class="card"><h2>资料库目录树（按存储路径 · 双击文件查看详情）</h2>
    ${items.length?`<div class="ptree">${renderPathTree(buildPathTree())}</div>`:`<p class="muted">暂无资料。</p>`}
  </div>`;
}

/* ---------- 资料库目录树（按存储路径） ---------- */
function buildPathTree(){
  let c=0;
  const mk=name=>({id:'pn'+(c++),name,children:{},files:[]});
  const root=mk('资料库');
  DB.items.forEach((i,idx)=>{
    let p=(i.path||'').trim();
    let parts;
    if(!p){parts=['（未指定路径）'];}
    else if(/^https?:\/\//i.test(p)){
      try{const u=new URL(p);parts=[u.host.replace(/\/+$/,''),...u.pathname.split('/').filter(Boolean)];}catch(e){parts=[p];}
    }else{
      parts=p.replace(/\\/g,'/').replace(/^\/+/,'').split('/').filter(Boolean);
      if(!parts.length)parts=[p];
    }
    let cur=root;
    parts.forEach(seg=>{if(!cur.children[seg])cur.children[seg]=mk(seg);cur=cur.children[seg];});
    cur.files.push({name:i.name,idx,status:i.status});
  });
  return root;
}
function countFiles(node){let n=node.files.length;for(const k in node.children)n+=countFiles(node.children[k]);return n;}
function renderPathTree(node){
  const keys=Object.keys(node.children).sort((a,b)=>a.localeCompare(b,'zh'));
  let h='';
  keys.forEach(k=>{
    const c=node.children[k];
    h+='<div class="pt-node"><div class="pt-row" onclick="togglePathTree(\''+c.id+'\')">'

      +'<span class="pt-label">'+esc(k)+'</span>'
      +'<span class="pt-count">'+countFiles(c)+'</span></div>'
      +'<div class="pt-children" id="'+c.id+'">'+renderPathTree(c)
      +c.files.map(f=>'<div class="pt-row pt-file" ondblclick="openItem('+f.idx+')" title="双击查看详情">'
        +'<span class="pt-caret"></span><span class="pt-ico">📄</span>'

      +'</div></div>';
  });
  return h;
}

function invBatchDelete(){
  const idxs=getCheckedIdxs();

  if(!confirm("确认删除选中的 "+idxs.length+" 条资料？此操作不可撤销。"))return;
  idxs.sort((a,b)=>b-a); // 从大到小删除，避免索引错位

function crc32(buf){

function unescXml(s){return (s||"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");}
function parseZip(buf){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);let eocd=-1;
  for(let i=buf.length-22;i>=0;i--){if(buf[i]===0x50&&buf[i+1]===0x4b&&buf[i+2]===0x05&&buf[i+3]===0x06){eocd=i;break;}}

  const enc=new TextDecoder();const entries={};let p=cdOffset;
  for(let i=0;i<cdCount;i++){
    const nameLen=dv.getUint16(p+28,true);const extraLen=dv.getUint16(p+30,true);const commentLen=dv.getUint16(p+32,true);
    const method=dv.getUint16(p+10,true);const compSize=dv.getUint32(p+20,true);const localOffset=dv.getUint32(p+42,true);

async function inflateRaw(data){
  const ds=new DecompressionStream("deflate-raw");

}
function parseSharedStrings(xml){const arr=[];const re=/<si>([\s\S]*?)<\/si>/g;let m;while((m=re.exec(xml)))arr.push(extractText(m[1]));return arr;}

function parseSheetRows(xml,shared){
  const rows=[];const rowRe=/<row\b[^>]*>([\s\S]*?)<\/row>/g;let rm;
  while((rm=rowRe.exec(xml))){
    const rowXml=rm[1];const cells=[];const cRe=/<c\b([^>]*)(?:\/>|(?:>([\s\S]*?)<\/c>))/g;let cm;
    while((cm=cRe.exec(rowXml))){
      const attrs=cm[1];const inner=cm[2]||"";let val="";
      if(/t="s"/.test(attrs)){const vM=inner.match(/<v>(\d+)<\/v>/);if(vM)val=shared[+vM[1]]||"";}
      else if(/t="inlineStr"/.test(attrs)){const tM=inner.match(/<t[^>]*>([\s\S]*?)<\/t>/);if(tM)val=tM[1];}
      else{const vM=inner.match(/<v>([\s\S]*?)<\/v>/);if(vM)val=vM[1];}

async function invImportExcel(file){
  try{
    const buf=await file.arrayBuffer();const bytes=new Uint8Array(buf);
    let entries;try{entries=parseZip(bytes);}catch(e){alert("无法解析该文件，请确认是 .xlsx（Excel）文件");return;}
    const sheetName=Object.keys(entries).find(n=>/xl\/worksheets\/sheet\d+\.xml$/.test(n));
    if(!sheetName){alert("文件中未找到工作表");return;}
    let sheetB=entries[sheetName].data;
    if(entries[sheetName].method===8){if(typeof DecompressionStream==="undefined"){alert("当前浏览器不支持解压，请用最新版 Chrome/Edge");return;}sheetB=await inflateRaw(sheetB);}

    let shared=[];if(ssName){let sb=entries[ssName].data;if(entries[ssName].method===8)sb=await inflateRaw(sb);shared=parseSharedStrings(new TextDecoder().decode(sb));}
    const rows=parseSheetRows(new TextDecoder().decode(sheetB),shared);
    if(rows.length<2){alert("文件中没有数据行");return;}
    const header=rows[0].map(h=>(h||"").trim());const col={};header.forEach((h,i)=>col[h]=i);
    const get=(r,k)=>col[k]!=null?rows[r][col[k]]:"";

      <div><label>修订资料清单</label><textarea id="l_rev" placeholder="DOC-0002 V1.0→V1.1"></textarea></div>
      <div><label>废止资料清单</label><textarea id="l_ab" placeholder="DOC-0000 旧版本"></textarea></div>
    </div>
    <div style="margin-top:6px"><label>通知情况</label><input id="l_n" placeholder="已通知销售/市场/研发，邮件日期"></div>
    <div style="margin-top:8px"><button class="act" onclick="ledAdd()">登记本季度发布</button></div>
  </div>
  <div class="card"><h2>历史发布记录（${DB.ledger.length}）</h2>
    ${DB.ledger.length?`<table><thead><tr><th>季度</th><th>发布日期</th><th>发布人</th><th>新增</th><th>修订</th><th>废止</th><th>通知</th><th></th></tr></thead><tbody>
    ${DB.ledger.map((r,k)=>`<tr><td>${r.q}</td><td>${r.d}</td><td>${esc(r.p||"")}</td><td>${esc(r.add||"")}</td><td>${esc(r.rev||"")}</td><td>${esc(r.ab||"")}</td><td>${esc(r.n||"")}</td><td><span class="x" onclick="ledDel(${k})">✕</span></td></tr>`).join("")}</tbody></table>`
    :`<p class="muted">暂无记录。</p>`}
  </div>`;
}
function ledAdd(){
  DB.ledger.unshift({q:$("#l_q").value.trim(),d:$("#l_d").value.trim(),p:$("#l_p").value.trim(),add:$("#l_add").value.trim(),rev:$("#l_rev").value.trim(),ab:$("#l_ab").value.trim(),n:$("#l_n").value.trim()});
  save();render();
}
function ledDel(k){DB.ledger.splice(k,1);save();render();}

/* ---------- 命名校验 ---------- */
function val(m){
  m.innerHTML=`<div class="card"><h2>文件名命名校验工具</h2>
    <div class="hint">规范第七条：<b>【产品线】-【资料类型】-【标题】-【版本号】-【发布日期】</b><br>
    资料类型限定：${TYPES.join(" / ")}；版本号 V1.0/V1.1 或 2026.Q3.01；发布日期 2026Q3 或 2026-07-01。</div>
    <div class="bar"><input id="vf" class="search" placeholder="粘贴文件名，如 产品A-技术白皮书-聚氨酯应用技术-V2.0-2026Q3" oninput="valCheck()">
    <button class="ghost" onclick="valFix()">一键生成标准名</button></div>
    <div id="vres"></div>
    <div class="row r3" style="margin-top:12px">
      <div><label>产品线</label><input id="gx_pl" placeholder="产品A"></div>
      <div><label>资料类型</label><select id="gx_type">${TYPES.map(t=>`<option>${t}</option>`).join("")}</select></div>
      <div><label>标题</label><input id="gx_title" placeholder="聚氨酯应用技术"></div>
    </div>
    <div class="row r2" style="margin-top:6px">
      <div><label>版本号</label><input id="gx_ver" placeholder="V2.0"></div>
      <div><label>发布日期</label><input id="gx_date" placeholder="2026Q3"></div></div>
    <div style="margin-top:8px"><button class="act" onclick="valGen()">生成标准文件名</button> <span id="gname" class="pill"></span></div>
  </div>`;
}
function valCheck(){
  const n=$("#vf").value.trim();const box=$("#vres");
  if(!n){box.innerHTML="";return;}
  const v=validateName(n);
  if(v.ok){box.innerHTML=`<p class="ok">✓ 命名合规</p>
    <table><tr><th>产品线</th><td>${v.parts[0]}</td></tr><tr><th>资料类型</th><td>${v.parts[1]}</td></tr>
    <tr><th>标题</th><td>${v.parts[2]}</td></tr><tr><th>版本号</th><td>${v.parts[3]}</td></tr>
    <tr><th>发布日期</th><td>${v.parts[4]}</td></tr></table>`;}
  else{box.innerHTML=`<p class="bad">✗ 不合规（${v.msgs.length} 处问题）</p><ul class="bad">${v.msgs.map(x=>`<li>${x}</li>`).join("")}</ul>`;}
}
function valGen(){
  const pl=$("#gx_pl").value.trim(),tp=$("#gx_type").value,t=$("#gx_title").value.trim(),v=$("#gx_ver").value.trim(),d=$("#gx_date").value.trim();
  if(!pl||!t||!v||!d){alert("请填写全部字段");return;}
  if(!VER_RE.test(v)){alert("版本号格式错误");return;}
  if(!DATE_RE.test(d)){alert("发布日期格式错误");return;}
  const name=`${pl}-${tp}-${t}-${v}-${d}`;
  $("#gname").textContent=name;
  navigator.clipboard&&navigator.clipboard.writeText(name);
}
function valFix(){if($("#vf").value.trim())$("#vf").select();}

/* ---------- 数据备份 ---------- */
function data(m){
  m.innerHTML=`<div class="card"><h2>数据备份与恢复</h2>
    <p class="muted">本工具数据保存在当前浏览器（localStorage）。建议定期导出备份；如需多人共享，可将导出的 JSON 放到内网文件服务器，或改用本地服务器部署。</p>
    <div class="bar">
      <button class="act" onclick="dataExport()">导出现有数据(JSON)</button>
      <button class="ghost" onclick="$('#imp').click()">导入备份</button>
      <input id="imp" type="file" accept="application/json" style="display:none" onchange="dataImport(this)">
      <button class="ghost danger" onclick="dataReset()">清空全部数据</button>
    </div>
    <div class="hint">数据量：资料 ${DB.items.length} 条 · 发布季度 ${DB.ledger.length} 个 · 分类 ${DB.cats.length} 类</div>
  </div>
  <div class="card"><h2>规范化落地清单（对照本规范）</h2>
    <table><thead><tr><th>章节</th><th>落地动作（IT运维视角）</th><th>本工具对应</th></tr></thead><tbody>
    ${[["第三章 命名","所有文件按 产品线-类型-标题-版本-日期 命名","命名校验工具"],
      ["第四章 版本","每条资料仅一份现行版，历史归档不删除","资料台账+版本记录"],
      ["第五章 审核","内容/合规/归口三级审核通过再发布","台账状态+发布台账登记"],
      ["第六章 季度","每季度末盘点更新并登记发布台账","季度发布台账"],
      ["第七章 资料库","统一资料库按分类目录组织+权限控制","分类目录+路径字段"],
      ["第八章 考核","责任人明确，违规可追溯","责任人/审批人字段"]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="pill">${r[2]}</span></td></tr>`).join("")}
    </tbody></table>
  </div>`;
}
function dataExport(){download("标准技术资料数据_"+today()+".json",JSON.stringify(DB,null,2));}
function dataImport(f){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(d&&d.items!==undefined){if(confirm("导入将覆盖当前全部数据，确认？")){DB=d;save();render();alert("导入成功（全量覆盖）");}}else if(Array.isArray(d)&&d.length&&d[0].type!==undefined){if(confirm("检测到这是分类目录文件，将覆盖【分类目录】且保留其它数据，确认？")){DB.cats=d;save();render();alert("分类目录导入成功");}}else{alert("文件格式无法识别（需为完整数据备份 或 分类目录JSON）");}}catch(e){alert("文件格式错误：不是合法JSON");}};fr.readAsText(f.files[0]);}
function dataReset(){if(confirm("将清空所有资料、版本、台账数据，确认？")){DB=seed();save();render();}}

/* ---------- utils ---------- */
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function download(name,content){const b=new Blob([content],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href);}

$$("#nav button").forEach(b=>b.onclick=()=>goto(b.dataset.tab));
render();
</script>
</body>
</html>
